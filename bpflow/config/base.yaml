# BPFlow shared config. train/infer configs reference this via `_base_: base.yaml`.
# Holds ONLY params shared across datasets: model WIDTH (hidden_dim/heads/depth),
# channel order, split/task system, sampling + training defaults, prediction_type.
# Dataset-specific shapes/paths/normalization (patch_size, seq_len, train_npy,
# test_npy, abp_mean, abp_std) live in the per-dataset configs (pulsedb.yaml /
# uci.yaml); the dataclass defaults in trainer_utils.py back them up (= PulseDB).

model:
  name: bpflow_jointstream  # 3-stream joint attention: ABP latent + ECG + PPG
  hidden_dim: 512
  num_heads: 8              # head_dim 64 (must be even for RoPE)
  depth: 12
  mlp_ratio: 4.0
  joint_depth: 8            # first 8 layers are 3-stream joint; last 4 are latent-only

data:
  # train_npy / test_npy / seq_len / abp_mean / abp_std are DATASET-SPECIFIC -> set in
  # pulsedb.yaml & uci.yaml (dataclass defaults back them up = PulseDB). Not here.
  ecg_channel: 0            # verified: ch0=ECG, ch1=PPG, ch2=ABP
  ppg_channel: 1
  abp_channel: 2
  split_seed: 42
  val_fraction: 0.2
  split_mode: segment       # segment (subject leaks across train/val) | subject (honest)
  abp_clip_low: 20.0        # physiological ABP clip [20,250] mmHg — shared (post-clip stats)
  abp_clip_high: 250.0
  cond_recenter: true
  # Multi-target task system. Each TRAIN sample draws a (cond->target) task (named
  # with "2" for "->", e.g. ppg2abp); the absent stream is masked out of joint
  # attention (task-routing mask), so one unified model serves every task. tasks =
  # which to train ([] = all five: ecg_ppg2abp, ecg2abp, ppg2abp, ppg2ecg, ecg2ppg);
  # task_probs = the draw distribution aligned to tasks ([] = uniform); eval_task =
  # the single fixed task val uses ("" = first ->ABP task). A single-element tasks
  # list = a specialist. Default: all five, ->ABP-heavy. Inherited by pulsedb/uci/smoke.
  tasks: [ecg_ppg2abp, ecg2abp, ppg2abp, ppg2ecg, ecg2ppg]
  task_probs: [0.30, 0.20, 0.20, 0.15, 0.15]
  eval_task: ""

sampling:
  prediction_type: v        # shared train (loss target) + infer (ODE)
  method: euler
  num_steps: 16
  noise_scale: 1.0
  noise_shift: 1.0
  min_sigma: 0.0
  logit_mean: 0.0
  logit_scale: 1.0

training:
  loss_type: v
  epochs: 100
  batch_size: 64             # GLOBAL batch (auto-divided by num_gpus); per-dataset configs override
  num_workers: 2             # PER RANK default, set for the most-constrained node (16-core /
                             # 8-GPU = ~2 cores/rank). H800 nodes are GPU-bound (SM~100%) so 2
                             # costs no speed; higher would oversubscribe the 16-core node.
  lr: 1.0e-4
  weight_decay: 0.0
  warmup_steps: 1000
  clip_grad_norm: 1.0
  seed: 14159265
  log_freq: 50
  ckpt_freq_epoch: 5
  val_freq_epoch: 5          # in-loop validation every N epochs (0 = off); saves checkpoint_best.pth
  val_loss_max_batches: 50   # per-modality val flow-matching loss (val/loss_*): -1 = full val, 0 = off, N = cap/rank
  ema_decay: 0.9999
  use_ema: true
  output_dir: output
  device: auto
  amp_dtype: bfloat16
  max_steps: -1
  use_swanlab: false        # SwanLab experiment logging (rank-0 only)
  swanlab_project: bpflow
  swanlab_mode: online      # online | local | offline | disabled
  repeat_factor: 1
  run_test_after_train: false  # eval CalFree test after training (best EMA) + log test/*
  test_max_segments: -1        # cap test segments (-1 = all)
