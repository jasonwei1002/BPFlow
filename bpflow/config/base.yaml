# BPFlow shared config. train/infer configs reference this via `_base_: base.yaml`.
# Anything affecting architecture, on-disk shapes, or checkpoint compatibility
# (patch_size, normalization constants, prediction_type) lives here.

model:
  name: bpflow_jointstream  # 3-stream joint attention: ABP latent + ECG + PPG
  patch_size: 10            # 1250 / 10 = 125 tokens (80 ms each)
  hidden_dim: 512
  num_heads: 8              # head_dim 64 (must be even for RoPE)
  depth: 12
  mlp_ratio: 4.0
  joint_depth: 8            # first 8 layers are 3-stream joint; last 4 are latent-only
  use_demo: false           # condition on demographics (age/gender/height/weight/bmi)

data:
  train_npy: rawdata/pulsedb/Train_Subset.npy
  test_npy: rawdata/pulsedb/CalFree_Test_Subset.npy
  seq_len: 1250
  ecg_channel: 0            # verified: ch0=ECG, ch1=PPG, ch2=ABP
  ppg_channel: 1
  abp_channel: 2
  split_seed: 42
  val_fraction: 0.2
  split_mode: segment       # segment (subject leaks across train/val) | subject (honest)
  abp_mean: 81.94           # full train split (seed=42, 80%, post-clip)
  abp_std: 24.43
  abp_clip_low: 20.0
  abp_clip_high: 250.0
  cond_recenter: true
  # input "direction": which signal(s) condition ABP. ecg_ppg = both (default);
  # ecg = ECG only; ppg = PPG only. The absent stream is replaced by a learned
  # null token in the model (via cond_mask), NOT zeroed — arch/params/ckpt shape
  # stay identical across directions. train AND infer must use the same value.
  cond_modality: ecg_ppg
  # per-sample modality dropout (TRAIN only) → one unified model for all 3
  # directions. Each train sample randomly keeps ecg_ppg/ecg/ppg (probs below,
  # [ecg_ppg, ecg, ppg]); val/test/infer use the fixed cond_modality above.
  # true = UNIFIED default (one model serves all 3 directions); set false here
  # for the per-direction specialist setup. Inherited by gpu/finetune/smoke.
  modality_dropout: true
  modality_dropout_probs: [0.34, 0.33, 0.33]  # [ecg_ppg, ecg, ppg] ~uniform (only used when modality_dropout: true)
  # clinical-metric TRUE source for infer.py (pred is always per-beat from the
  # generated wave): waveform = per-beat on the true ABP wave (no CSV, no
  # definitional offset) | csv = the CSV cuff [sbp,dbp,map] label | both = report
  # both side by side. csv/both need the sibling CSV. Override per-run: infer --true-source.
  eval_true_source: waveform
  # demographic z-score constants (full train split, non-NaN); used when model.use_demo
  demo_age_mean: 61.11
  demo_age_std: 15.10
  demo_height_mean: 162.50
  demo_height_std: 9.64
  demo_weight_mean: 60.82
  demo_weight_std: 11.66
  demo_bmi_mean: 22.92
  demo_bmi_std: 3.44

sampling:
  prediction_type: v        # shared train (loss target) + infer (ODE)
  method: euler
  num_steps: 16
  noise_scale: 1.0
  noise_shift: 1.0
  min_sigma: 0.0
  logit_mean: 0.0
  logit_scale: 1.0

training:
  loss_type: v
  epochs: 100
  batch_size: 64
  num_workers: 4
  lr: 1.0e-4
  weight_decay: 0.0
  warmup_steps: 1000
  clip_grad_norm: 1.0
  seed: 14159265
  log_freq: 50
  ckpt_freq_epoch: 5
  val_freq_epoch: 5          # in-loop validation every N epochs (0 = off); saves checkpoint_best.pth
  val_loss_max_batches: 50   # per-modality val flow-matching loss (val/loss_*): -1 = full val, 0 = off, N = cap/rank
  ema_decay: 0.9999
  use_ema: true
  output_dir: output
  device: auto
  amp_dtype: bfloat16
  max_steps: -1
  use_swanlab: false        # SwanLab experiment logging (rank-0 only)
  swanlab_project: bpflow
  swanlab_mode: online      # online | local | offline | disabled
  repeat_factor: 1
  run_test_after_train: false  # eval CalFree test after training (best EMA) + log test/*
  test_max_segments: -1        # cap test segments (-1 = all)
