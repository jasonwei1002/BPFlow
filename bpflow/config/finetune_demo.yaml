# Finetune config WITH demographics prior (use_demo: true).
# Identical to finetune.yaml except it turns the demographics prior ON, so it
# matches a w-demo pretrained checkpoint (which carries demo_encoder.*).
# finetune.yaml's use_demo:false would RuntimeError on such a checkpoint.
#
# Use it to finetune a w-demo pretrain on CalFree (stratified 8:1:1, auto-tests
# the held-out 10% at the end -> test/*):
#   bash finetune.sh output/<w_demo_pretrain_ts>/checkpoint_best.pth \
#     --config bpflow/config/finetune_demo.yaml
#   # or direct:
#   torchrun --nproc_per_node=gpu -m bpflow.train \
#     --config bpflow/config/finetune_demo.yaml --init-ckpt output/<w_demo_ts>/checkpoint_best.pth
#
# Demographics need the sibling CSV (CalFree_Test_Subset.csv) for age/gender/
# height/weight/bmi — the stratified split already requires that CSV anyway.

_base_: finetune.yaml

model:
  use_demo: true            # demographics prior ON (overrides finetune.yaml's false)
