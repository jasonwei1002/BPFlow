# Low-data finetune config for data-efficiency sweeps (finetune_train_ratio << 1).
# Inherits finetune.yaml; only shrinks batch_size + warmup so a tiny finetune-train
# split still gets enough gradient steps per epoch on 8 GPUs (everything else —
# lr 1e-4, stratified split, early-stop — stays the same as finetune.yaml).
#
# Why this exists: at finetune_train_ratio=0.01 the CalFree finetune-train split is
# ~837 segments. With finetune.yaml's bs32 x 8 GPUs = global 256, that's only ~3
# steps/epoch, so the 1000-step warmup never finishes before early stopping (lr stays
# ~1% of target, the model barely trains). bs4 x 8 = global 32 -> ~26 steps/epoch, and
# warmup 20 completes inside the first epoch.
#
# Use the SAME setup for every low ratio so the data-efficiency curve varies only the
# data amount, not the optimizer:
#   bash finetune.sh <ckpt> --config bpflow/config/finetune_lowdata.yaml data.finetune_train_ratio=0.01
#   bash finetune.sh <ckpt> --config bpflow/config/finetune_lowdata.yaml data.finetune_train_ratio=0.05
#   bash finetune.sh <ckpt> --config bpflow/config/finetune_lowdata.yaml data.finetune_train_ratio=0.10
# (finetune.sh's hardcoded --config finetune.yaml is overridden by this later --config.)

_base_: finetune.yaml

training:
  batch_size: 4              # per-GPU; 8 GPUs -> global 32 (vs finetune.yaml's 256), so a
                             # ~837-segment 1% split still gives ~26 grad steps/epoch
  val_batch_size: 64         # val/test sampler is eager + no backward -> keep it large
                             # so the tiny train batch_size doesn't slow validation
  warmup_steps: 20           # tiny split -> warmup must finish within ~1 epoch
                             # (finetune.yaml's 1000 would need hundreds of epochs here)
