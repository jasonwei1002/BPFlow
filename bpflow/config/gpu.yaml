# Real-training config (single/multi-GPU). 3-stream joint-attention model.
# Inherits architecture + normalization from base.yaml.
# Use:    python -m bpflow.train --config bpflow/config/gpu.yaml
# DDP:    torchrun --nproc_per_node=N -m bpflow.train --config bpflow/config/gpu.yaml

_base_: base.yaml

model:
  patch_size: 10
  hidden_dim: 512
  num_heads: 8
  depth: 12
  joint_depth: 8            # first 8 layers 3-stream joint; last 4 latent-only
  use_demo: false           # demographics prior off this round (pure ECG/PPG -> ABP)

data:
  split_mode: segment       # random per-segment train/val split (subjects shared across split)
  # modality_dropout: true is now the base.yaml default (UNIFIED model) → inherited here.

training:
  epochs: 1000               # ceiling only; early_stop_patience + plateau decay end runs sooner
  batch_size: 128            # per-GPU (DDP global = 128 x num_gpus)
  num_workers: 8
  lr: 3.0e-4               # 8 GPUs x bs128 = global 1024; sqrt-scaled from 1e-4@128 (~2.8e-4)
  warmup_steps: 1000
  device: cuda
  amp_dtype: bfloat16
  use_ema: true
  max_steps: -1
  val_freq_epoch: 1          # validate every epoch so patience below counts in epochs
  val_eval_fraction: 0.1     # validate on a representative stride-sampled 10% of val
                             # (covers all subjects; fixed across epochs) — enough to
                             # track the MAE trend at ~10x cheaper validation
  val_loss_max_batches: -1   # per-modality val flow-matching loss on the FULL val split (-1 = all)
  lr_patience: 5             # 5 epochs w/o val improvement -> lr x lr_decay
  lr_decay: 0.1              # "下降10倍"
  early_stop_patience: 10    # 10 epochs w/o val improvement -> stop
  use_swanlab: true
  swanlab_project: bpflow
  swanlab_mode: online      # online | local | offline | disabled
  run_test_after_train: false # pretraining does NOT touch CalFree; test runs only in the finetune flow
  test_max_segments: -1      # cap test segments (-1 = all); used by the finetune test split
