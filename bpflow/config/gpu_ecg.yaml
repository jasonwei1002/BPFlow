# ECG-only specialist (pure ECG -> ABP). Inherits gpu.yaml; the ONLY change vs the
# UNIFIED default (base.yaml trains all five tasks) is a single-task list:
#   tasks: [ecg2abp]   -> every split (train/val/test) uses the one direction, so
#                         val MAE measures the ecg2abp direction -> correct
#                         best-ckpt/early-stop. The PPG stream is masked out of joint
#                         attention (task-routing mask); the model never sees PPG.
#   trained_tasks() = {ecg2abp}, baked into the saved config so infer auto-evaluates
#   just that direction.
# Pretrain:  bash train_pulsedb.sh --config bpflow/config/gpu_ecg.yaml
_base_: gpu.yaml

data:
  tasks: [ecg2abp]    # specialist: the single trained (cond->target) task
  task_probs: []      # single task -> uniform (i.e. always this task)
