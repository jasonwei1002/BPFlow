# PPG-only specialist (pure PPG -> ABP). Inherits gpu.yaml; the ONLY change vs the
# UNIFIED default (base.yaml trains all five tasks) is a single-task list:
#   tasks: [ppg2abp]   -> every split (train/val/test) uses the one direction, so
#                         val MAE measures the ppg2abp direction -> correct
#                         best-ckpt/early-stop. The ECG stream is masked out of joint
#                         attention (task-routing mask); the model never sees ECG.
#   trained_tasks() = {ppg2abp}, baked into the saved config so infer auto-evaluates
#   just that direction.
# Pretrain:  bash train_pulsedb.sh --config bpflow/config/gpu_ppg.yaml
_base_: gpu.yaml

data:
  tasks: [ppg2abp]    # specialist: the single trained (cond->target) task
  task_probs: []      # single task -> uniform (i.e. always this task)
