# PPG-only specialist (pure PPG -> ABP). Inherits gpu.yaml; the ONLY change vs the
# UNIFIED default (base.yaml modality_dropout: true) is the conditioning direction:
#   modality_dropout: false -> no per-sample modality draw; EVERY split (train/val/
#                              test) uses the fixed direction below, so val MAE
#                              measures the ppg direction -> correct best-ckpt/early-stop.
#   cond_modality: ppg      -> cond_mask [0,1]; the ECG stream is replaced by the
#                              learned null_ecg (no ECG data enters). The model never
#                              sees ECG. trained_modalities() = {ppg}, baked into the
#                              saved config so infer.sh auto-evaluates just ppg.
# Pretrain:  bash train.sh --config bpflow/config/gpu_ppg.yaml
_base_: gpu.yaml

data:
  modality_dropout: false   # specialist: no modality draw (overrides base's unified true)
  cond_modality: ppg        # PPG -> ABP on all splits
