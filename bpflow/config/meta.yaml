# ANIL/CAVIA meta-pretraining: learn an easily-adaptable model so a new subject
# needs only a few cuff-calibration segments to hit target BP accuracy.
# Inherits the gpu.yaml architecture; flips on the per-subject context + meta loop.
#
# Use:
#   bash train.sh --nproc 8 --config bpflow/config/meta.yaml
#   python -m bpflow.train --config bpflow/config/meta.yaml
# Standalone K-shot eval of a trained checkpoint:
#   python -m bpflow.kshot_eval --config bpflow/config/meta.yaml --ckpt <best> --use-ema

_base_: gpu.yaml

model:
  use_context: true          # per-subject ANIL context vector (adapted in the inner loop)
  context_dim: 64

meta:
  enabled: true              # run the episodic meta loop instead of the standard epoch loop
  inner_objective: scalar    # cuff-only: adapt phi from support SBP/DBP (no support ABP). | waveform
  bp_loss_weight: 0.1        # outer-loss weight on the query SBP/DBP head term (trains BPHead)
  k_inner: 5                 # inner adaptation steps on the support set
  inner_lr: 0.05             # inner-loop SGD step on the context phi
  support_size: 5            # Ks: support (calibration) segments per training episode
  query_size: 5              # Kq: query segments per training episode
  meta_batch_subjects: 8     # subjects per outer meta-step (per rank)
  meta_steps: 20000          # total outer meta-steps
  log_every: 50
  ckpt_every: 1000
  val_every: 1000            # outer steps between K-shot validations
  val_subject_fraction: 0.2  # subject-disjoint val split of Train subjects
  eval_ks: "0,1,3,5,10"      # K-shot curve points (K=0 == calibration-free baseline)
  eval_max_subjects: 200     # cap subjects per K-shot eval
  eval_max_query: 40         # cap query segments per subject in eval
  num_workers: 8
