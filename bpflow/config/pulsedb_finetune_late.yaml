# Infer-only config for the LATE-fusion ablation (C1).
# Identical to pulsedb_finetune.yaml except model.stream_fusion=late, so a
# checkpoint trained with `model.stream_fusion=late` (the late_fuse layer) can be
# scored: bpflow.infer builds the model from the config file (it does NOT accept
# dotted key=value overrides and does NOT restore architecture from the ckpt), so
# the ablated architecture has to be spelled out in a config.
#
# Use:
#   bash infer_pulsedb.sh <late_ckpt> --config bpflow/config/pulsedb_finetune_late.yaml
_base_: pulsedb_finetune.yaml

model:
  stream_fusion: late
