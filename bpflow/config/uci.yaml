# Pretrain the unified 5-task model on the UCI cuff-less BP dataset (second
# benchmark; PPG2ABP / MD-ViSCo / UniCardio report on this set).
#
# UCI specifics vs PulseDB (the only things that differ):
#   - window length 1024 (vs 1250); 1024 % patch_size(8) == 0 -> 128 patches.
#   - ABP z-score constants recomputed on the UCI train fold (clip[20,250]).
#   - separate train/test fold .h5 -> .npy files (no subject_id CSV), so
#     split_mode is segment (train/val 80/20 within the train fold; test = the
#     whole test fold). The .npy are (N,3,1024) ch0=ECG/ch1=PPG/ch2=ABP(mmHg),
#     identical layout to PulseDB, so PulseDBDataset reads them unchanged.
#
# Architecture (patch_size, seq_len) differs from PulseDB -> a UCI checkpoint is
# NOT interchangeable with a PulseDB one (RoPE grid + patch dims differ). Train
# fresh; score the held-out test fold with:
#   python -m bpflow.infer --config bpflow/config/uci.yaml --ckpt <path> \
#     --split test --num -1 --use-ema
#
#   bash train_uci.sh                                        # all GPUs

_base_: base.yaml          # inherits ONLY base — no cross-dataset inheritance

model:
  patch_size: 8             # 1024 / 8 = 128 latent tokens (PulseDB used 10 -> 125)

training:
  # --- real-training preset (kept identical to pulsedb.yaml's pretrain preset, but
  #     spelled out here so uci.yaml stands alone on base.yaml — not inheriting PulseDB) ---
  epochs: 1000               # ceiling only; early-stop + plateau decay end runs sooner
  num_workers: 2             # PER RANK (most-constrained 8-GPU/16-core node -> ~2/rank; see pulsedb.yaml)
  device: cuda
  val_freq_epoch: 1          # validate every epoch so the patience counters count epochs
  val_eval_fraction: 0.1     # stride-sampled 10% of val (covers all subjects; cheap MAE trend)
  val_loss_max_batches: -1   # per-modality val flow-matching loss on the FULL val split
  lr_patience: 10            # epochs w/o val improvement -> lr x lr_decay
  lr_decay: 0.3              # gentler than 0.1 so an early plateau-decay isn't fatal
  early_stop_patience: 20    # >= 2x lr_patience; unified runs improve late. UNIFIED with
                             # PulseDB (both 20): the batch-32 shrink below restores step
                             # density to 443 vs PulseDB's 704 /epoch (1.59x fewer, NOT the
                             # 6x batch-1024 hypothetical), so 20 ep ~= PulseDB's step-patience.
  min_delta_frac: 0.005      # RELATIVE improvement threshold (frac of best_val), scale-invariant
  use_swanlab: true
  # --- UCI-specific deltas: shrink the global batch to restore PulseDB-like step
  #     density on the ~6.4x smaller train fold (~110 -> 443 steps/epoch); lr sqrt-rescaled ---
  batch_size: 256           # GLOBAL batch (auto-divided by num_gpus; 8 GPUs -> 32/GPU). PulseDB pretrain: 1024
  lr: 1.5e-4               # = 3e-4 x sqrt(256/1024), sqrt-scaled for global batch 256
  warmup_steps: 500         # ~1.1 epoch at 443 steps/epoch

data:
  train_npy: rawdata/uci/UCI_Train_Dataset_fold_1.npy
  test_npy: rawdata/uci/UCI_Test_Dataset_fold_1.npy
  seq_len: 1024             # UCI native window (125 Hz, ~8.19 s); NOT resampled
  abp_mean: 86.7715         # UCI train fold, post-clip[20,250]
  abp_std: 24.4212
  split_mode: segment       # no subject_id in the UCI .npy -> per-segment 80/20
