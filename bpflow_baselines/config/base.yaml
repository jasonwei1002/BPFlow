# Shared defaults for all baselines (PulseDB pretrain setting).
# data mirrors bpflow base.yaml so splits/normalization constants are identical.
# Finetune is enabled via CLI overrides in finetune_baseline_pulsedb.sh.

data:
  train_npy: rawdata/pulsedb/Train_Subset.npy
  test_npy: rawdata/pulsedb/CalFree_Test_Subset.npy
  seq_len: 1250
  ecg_channel: 0
  ppg_channel: 1
  abp_channel: 2
  split_seed: 42
  val_fraction: 0.2
  abp_mean: 81.94
  abp_std: 24.43
  abp_clip_low: 20.0
  abp_clip_high: 250.0
  cond_recenter: true
  split_mode: segment
  finetune: false
  finetune_val_fraction: 0.1
  finetune_test_fraction: 0.1
  finetune_train_ratio: 1.0
  finetune_split_mode: stratified

model:
  patch_size: 10        # only used by bpflow build_dataset (unpatchify cancels it)

training:
  # NOTE: batch_size is the GLOBAL batch (the paper's value). Under DDP it is
  # split evenly across GPUs (global // world_size per GPU), so the effective
  # global batch — and thus the paper's lr — stays correct on any GPU count.
  seed: 42
  num_workers: 4
  val_batch_size: 64
  val_freq_epoch: 1
  log_freq: 50
  ckpt_freq_epoch: 5
  device: auto
  amp_dtype: bfloat16      # bf16 autocast in supervised trainer (GAN keeps fp32)
  use_swanlab: false
  swanlab_project: bpflow-baselines
  swanlab_group: ""        # set by run_baselines_grid.sh so all cells share one group
  output_dir: output/baselines
