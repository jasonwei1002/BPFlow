_base_: base.yaml
# MD-ViSCo — two-stage: UNetSwinUnet approximation + BP predictor (->ABP).
model:
  name: mdvisco
  params:
    init_features: 64
    patch_size: 4
    depth: 1
    embedding_dim_multiplier: 4
    swin_num_heads: [32, 32, 32, 32, 32]
    swin_mlp_ratio: 4.0
    swin_drop_path_rate: 0.1
    kernel_size: 3
    style_dim: 3
training:
  # MD-ViSCo paper: batch 2048 (GLOBAL), lr 1e-3, scheduler patience 3,
  # early-stop patience 5, max 30K training steps.
  lr: 1.0e-3
  batch_size: 2048      # GLOBAL batch (auto-split across GPUs)
  epochs: 1000          # ceiling; max_steps governs
  max_steps: 30000
  scheduler: plateau
  lr_patience: 3
  lr_decay: 0.1
  early_stop_patience: 5
  lambda_bp: 1.0
