_base_: base.yaml
# MD-ViSCo — two-stage: UNetSwinUnet approximation + BP predictor (->ABP).
model:
  name: mdvisco
  params:
    init_features: 64
    patch_size: 4
    depth: 1
    embedding_dim_multiplier: 4
    swin_num_heads: [32, 32, 32, 32, 32]
    swin_mlp_ratio: 4.0
    swin_drop_path_rate: 0.1
    kernel_size: 3
    style_dim: 3
    deep_supervision: true   # MD-ViSCo stage-1 multi-scale (deep) supervision
    # stage-2 BP head (PatchTSMixer, aligned to MD-ViSCo BPModel WaveformEncoder):
    bp_num_layers: 15
    bp_d_model: 64
    bp_expansion_factor: 5
    bp_patch_length: 4
training:
  # MD-ViSCo paper: batch 2048, lr 1e-3, scheduler patience 3, early-stop 5,
  # max 30K steps. NOTE: the upgraded PatchTSMixer BP head (~43.7M for ->ABP)
  # makes batch 2048 OOM — dropped to 256 (bf16 autocast also on via base.yaml).
  lr: 1.0e-3
  batch_size: 256       # GLOBAL (auto-split across GPUs); was 2048 pre-upgrade
  epochs: 1000          # ceiling; max_steps governs
  max_steps: 30000
  scheduler: plateau
  lr_patience: 3
  lr_decay: 0.1
  early_stop_patience: 5
  lambda_bp: 1.0
