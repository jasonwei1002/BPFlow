_base_: base.yaml
# PPG2ABP — original-paper hyperparameters (Ibtehaz 2022, PMC9687508 + code):
# Adam (default lr 1e-3), 100 epochs, early-stop patience 20 (val loss).
# Loss: approximation (UNetDS64, deep supervision weights [1,.9,.8,.7,.6]) = MAE;
# refinement (MultiResUNet1D) = MSE. batch 256 (approx) -> use 256 for the joint
# cascade. base_channels 64, alpha 2.5.
model:
  name: ppg2abp
  params:
    base_channels: 64
    alpha: 2.5
training:
  lr: 1.0e-3
  batch_size: 256
  epochs: 100
  scheduler: none
  early_stop_patience: 20
  loss_base: mse        # MultiResUNet1D refinement (primary output)
  aux_loss_base: mae    # UNetDS64 deep-supervision aux outputs
